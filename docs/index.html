<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gevans Gestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral fixa de navegação + área de trabalho com cabeçalho de empresa/período; no celular a navegação vira faixa horizontal no topo */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface-2:#eef2f3; --line:#dde3e6; --ink:#16232a; --ink-2:#55656d; --ink-3:#83939a;
  --accent:#0d5f73; --accent-soft:#dcedf1; --accent-ink:#0a4b5b;
  --good:#1f7a4d; --good-soft:#e1f2e8; --warn:#a66300; --warn-soft:#fbefd9; --bad:#b4342b; --bad-soft:#f8e2df;
  --plan:#9aa8ae; --side:#10262e; --side-ink:#c7d6db; --side-ink-2:#7f989f; --side-hi:#1b3a44;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a1e; --surface:#16242a; --surface-2:#1c2d34; --line:#2a3d44; --ink:#e4ecee; --ink-2:#a3b4ba; --ink-3:#73878e;
  --accent:#4fb3c9; --accent-soft:#173f49; --accent-ink:#8fd3e2;
  --good:#5cc68f; --good-soft:#173a29; --warn:#e3a54a; --warn-soft:#3d2e14; --bad:#ec7a70; --bad-soft:#41201d;
  --plan:#5d7178; --side:#0b1417; --side-ink:#c7d6db; --side-ink-2:#6f878e; --side-hi:#18323b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1e; --surface:#16242a; --surface-2:#1c2d34; --line:#2a3d44; --ink:#e4ecee; --ink-2:#a3b4ba; --ink-3:#73878e;
  --accent:#4fb3c9; --accent-soft:#173f49; --accent-ink:#8fd3e2;
  --good:#5cc68f; --good-soft:#173a29; --warn:#e3a54a; --warn-soft:#3d2e14; --bad:#ec7a70; --bad-soft:#41201d;
  --plan:#5d7178; --side:#0b1417; --side-ink:#c7d6db; --side-ink-2:#6f878e; --side-hi:#18323b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.02em}
.brand b{font-size:15px;color:#fff;display:block;line-height:1.1}
.brand small{color:var(--side-ink-2);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--side-ink-2);padding:12px 8px 4px}
.nav a{color:var(--side-ink);text-decoration:none;padding:7px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;font-size:13.5px}
.nav a:hover{background:var(--side-hi)}
.nav a.on{background:var(--side-hi);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .count{font-family:var(--f-num);font-size:11px;background:var(--warn);color:#1b1100;border-radius:9px;padding:0 6px}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--side-ink-2);padding:0 8px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top h1{font-size:19px;margin:0;font-weight:700;text-wrap:balance}
.top .sub{color:var(--ink-2);font-size:12.5px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button,input[type=text]{font:inherit;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--line)}
.btn:focus-visible,select:focus-visible,a:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo{font-size:11.5px;background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:3px 8px;font-weight:600}
.content{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1320px;width:100%}
.grid{display:grid;gap:16px}
.g-tiles{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.panel h2{font-size:14px;margin:0 0 2px;font-weight:700}
.panel .hint{color:var(--ink-2);font-size:12.5px;margin:0 0 12px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-weight:600}
.tile .val{font-family:var(--f-num);font-size:22px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile .cmp{font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 7px;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.info{background:var(--accent-soft);color:var(--accent-ink)}
.chip.mute{background:var(--surface-2);color:var(--ink-2)}
.tbl-wrap{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;background:var(--surface);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.n{font-size:12.5px}
tr.tot td{font-weight:700;background:var(--surface-2)}
tr.pct td{color:var(--ink-2);font-style:italic;font-size:12px}
tr.l1 td:first-child{font-weight:700} tr.l2 td:first-child{padding-left:26px} tr.l3 td:first-child{padding-left:44px;color:var(--ink-2)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.neg{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:12.5px}
.seg button.on{background:var(--accent);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{font-family:var(--f-body)}
.alerts{display:flex;flex-direction:column;gap:0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.alert b{font-weight:600}
.alert small{color:var(--ink-2);display:block}
.versions{display:flex;flex-direction:column;gap:8px}
.ver{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;background:var(--surface)}
.ver.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ver small{color:var(--ink-2);display:block;font-size:12px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0;color:var(--ink-2);font-size:13px;max-width:60ch}
.drawer{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:rgba(10,20,24,.38)}
.drawer .sheet{background:var(--surface);width:min(620px,100%);height:100%;overflow:auto;padding-block:22px calc(22px + env(safe-area-inset-bottom,0px));padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;padding-top:calc(22px + env(safe-area-inset-top,0px))}
.sheet h3{margin:0;font-size:17px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{background:var(--surface-2);border-radius:7px;padding:8px 10px;min-width:0}
.kv small{display:block;color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kv span{font-family:var(--f-num);font-size:13px;overflow-wrap:anywhere}
.effect{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px}
.effect ul{margin:6px 0 0;padding-left:18px}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:8px;max-width:min(420px,calc(100% - 40px));z-index:30;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.bar-cell{display:flex;align-items:center;gap:8px}
.bar-cell span{display:block;height:6px;border-radius:3px;background:var(--accent)}
.muted{color:var(--ink-2)}
.mono{font-family:var(--f-num)}
@media (max-width:1100px){.g-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.g-2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));overflow-x:auto}
  .brand small,.nav-group,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav a{white-space:nowrap}
  .top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top{position:static}
  .g-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2e{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:no-preference){.drawer .sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fbtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:600;max-width:100%}
.fbtn small{font-weight:400;color:var(--ink-2)}
.fbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pop{position:absolute;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(10,20,24,.16);padding:12px;width:min(340px,calc(100vw - 32px));display:flex;flex-direction:column;gap:6px}
.pop .grp{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.pop .grp:first-of-type{border-top:0;padding-top:0}
.pop label{display:flex;gap:8px;align-items:center;padding:3px 2px;cursor:pointer}
.pop label.sub{padding-left:24px;color:var(--ink-2)}
.pop .acts{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.pop input{accent-color:var(--accent);width:15px;height:15px}
.linkbtn{background:none;border:0;color:var(--accent-ink);font-weight:600;cursor:pointer;padding:4px 0}
select:disabled,.seg.off{opacity:.45;pointer-events:none}
.unit{font-size:11.5px;color:var(--ink-2);display:block}
tr.grp-row td{background:var(--surface-2);font-weight:700}
.st-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sugg{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sugg select{font-size:12.5px;padding:4px 6px;max-width:250px}
.sugg .btn{padding:4px 10px;font-size:12.5px}
.why{font-size:11.5px;color:var(--ink-2);display:block;white-space:normal;max-width:300px}
td.wrap{white-space:normal;min-width:220px}
.audit-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.bal{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.bal div{display:flex;flex-direction:column}
.bal small{color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.bal span{font-family:var(--f-num)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:8px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;font-weight:600;color:var(--ink-2);cursor:pointer;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:820px){.audit-head{grid-template-columns:minmax(0,1fr)}.g-tiles.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
a.btn{text-decoration:none;display:inline-block}
[hidden]{display:none!important}
.auth{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--side)}
.auth-card{background:var(--surface);border-radius:12px;padding:28px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.auth-card h1{margin:0;font-size:20px}
.auth-card p{margin:0;color:var(--ink-2);font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.field input:focus-visible,.field select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.form-grid .wide{grid-column:1/-1}
.msg{font-size:13px;border-radius:6px;padding:8px 10px}
.msg.err{background:var(--bad-soft);color:var(--bad)} .msg.ok{background:var(--good-soft);color:var(--good)}
.linkbtn.small{font-size:12.5px}
.userbox{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--side-ink);padding:0 8px;flex-wrap:wrap}
.userbox b{color:#fff;font-weight:600}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.checks{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.checks label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.checks label.sub{padding-left:24px;color:var(--ink-2)}
.checks input{accent-color:var(--accent)}
.loading{opacity:.55;pointer-events:none}
.soon{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--side-ink-2);border:1px solid var(--side-hi);border-radius:4px;padding:0 4px}
.chart-scroll{overflow-x:auto}
.nav .nl{display:flex;align-items:center;gap:10px;min-width:0}.nav .ic{flex:none;opacity:.75}.nav a.on .ic,.nav a:hover .ic{opacity:1;color:#fff}.nav a.on .ic{color:#7FD3DF}
#brandLogo{display:flex}
.grade{font-size:12.5px}.grade th:first-child,.grade td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:220px}.grade thead th{position:sticky;top:0;background:var(--surface);z-index:2}.grade thead th:first-child{z-index:3}
.cel{width:78px;font:inherit;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 6px}.cel:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.ver.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.form-grid.f4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.chart-scroll svg{min-width:720px}.form-grid.f4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-tiles[style]{grid-template-columns:repeat(2,minmax(0,1fr))!important}.tile .val{font-size:18px}.form-grid{grid-template-columns:minmax(0,1fr)}.userbox{display:none}}
</style>
</head><body>

<div id="auth" class="auth" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><span id="brandLogo"></span><div><b id="brandNome">Gevans Gestor</b><small id="brandSub">Gevans Soluções</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="title">Painel</h1><div class="sub" id="subtitle"></div></div>
      <div class="filters" id="filtros">
        <button class="fbtn" id="fEmp" aria-haspopup="true" aria-expanded="false"><span id="fEmpTxt">Empresas</span><small>▾</small></button>
        <select id="fAno" aria-label="Ano"></select>
        <div class="seg" id="fTipo" role="group" aria-label="Tipo de período"><button data-per="ano">Ano</button><button data-per="tri">Trimestre</button><button data-per="mes">Mês</button></div>
        <select id="fPer" aria-label="Período"></select>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="layer"></div>
<div id="popLayer"></div>

<script>
// ===================== Marca e ícones (traço, estilo de linha)
const APP_NOME='Gevans Gestor',APP_SUB='Gevans Soluções';
const LOGO=`<svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M22.5 11.2A8 8 0 1 0 24 16h-7.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/><circle cx="23.6" cy="9.4" r="1.9" fill="#F2B544"/></svg>`;
const IC={
 painel:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
 dre:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
 faturamento:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
 fluxo:'<path d="M7 7h13l-3-3M17 17H4l3 3"/>',
 contas:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 15h3"/>',

function dre(ls){
  const G={},C={};let semGrupo=0;
  for(const l of ls){const c=conta(l.conta_id);const g=c?.grupo_dre;if(!g){semGrupo+=+l.valor;continue}G[g]=(G[g]||0)+ +l.valor;C[l.conta_id]=(C[l.conta_id]||0)+ +l.valor}
  const v=x=>G[x]||0;
  const d={rb:v('receita_bruta'),de:v('deducoes'),cu:v('custos'),dop:v('despesas_operacionais'),rf:v('resultado_financeiro'),ou:v('outras')+v('nao_operacional'),ir:v('ir_csll')};
  d.rl=d.rb+d.de;d.lb=d.rl+d.cu;d.eb=d.lb+d.dop;d.lair=d.eb+d.rf+d.ou;d.ll=d.lair+d.ir;
  d.mb=d.lb/d.rl;d.me=d.eb/d.rl;d.ml=d.ll/d.rl;d.contas=C;d.semGrupo=semGrupo;d.n=ls.length;return d;
}

function niceStep(r){if(!(r>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return (f<1.5?1:f<3?2:f<7?5:10)*p}
function chartBarsLine({labels,bars,line,hi,nomeBar,nomeLine}){
  const W=640,H=230,L=58,R_=12,T=14,B=28,iw=W-L-R_,ih=H-T-B;
  const max=(Math.max(0,...bars.concat(line).filter(v=>v!=null))||1)*1.08;const n=labels.length,bw=iw/n;
  const y=v=>T+ih-(Math.max(v,0)/max)*ih;const step=niceStep(max/4);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(nomeBar)} por mês">`;
  for(let t=0;t<=max;t+=step)s+=`<line x1="${L}" x2="${W-R_}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${k(t).replace('R$ ','')}</text>`;
  bars.forEach((v,i)=>{if(!v)return;const x=L+i*bw+bw*.2;s+=`<rect x="${x}" y="${y(v)}" width="${bw*.6}" height="${T+ih-y(v)}" rx="2" fill="var(--accent)" opacity="${hi.has(i)?1:.35}"><title>${labels[i]} · ${esc(nomeBar)}: ${brl.format(v)}</title></rect>`});
  if(line&&line.some(v=>v)){const pts=line.map((v,i)=>[L+i*bw+bw/2,y(v||0)]);
    s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--ink-2)" stroke-width="1.6" stroke-dasharray="4 3"/>`;
    pts.forEach((p,i)=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="var(--surface)" stroke="var(--ink-2)" stroke-width="1.4"><title>${labels[i]} · ${esc(nomeLine)}: ${brl.format(line[i]||0)}</title></circle>`)}
  labels.forEach((l,i)=>s+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="${hi.has(i)?'var(--ink)':'var(--ink-3)'}" font-weight="${hi.has(i)?600:400}">${l}</text>`);
  return s+'</svg>';
}
function chartFluxo({labels,ent,sai,acum}){
  const W=1100,H=300,L=64,R_=12,T=14,B=28,iw=W-L-R_,ih=H-T-B;const ac=acum.filter(v=>v!=null);
  const hiV=Math.max(1,...ent,...ac),loV=Math.min(0,...sai,...ac);const max=hiV*1.08,min=loV*1.08;const n=labels.length,bw=iw/n;
  const y=v=>T+ih-((v-min)/(max-min))*ih;const step=niceStep((max-min)/5);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Entradas, saídas e geração de caixa acumulada por mês">`;
  for(let t=Math.ceil(min/step)*step;t<=max;t+=step)s+=`<line x1="${L}" x2="${W-R_}" y1="${y(t)}" y2="${y(t)}" stroke="${Math.abs(t)<step/2?'var(--ink-3)':'var(--line)'}"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${k(t).replace('R$ ','')}</text>`;
  labels.forEach((l,i)=>{const x=L+i*bw+bw*.18,w=bw*.64;
    if(ent[i])s+=`<rect x="${x}" y="${y(ent[i])}" width="${w}" height="${y(0)-y(ent[i])}" rx="2" fill="var(--good)" opacity=".85"><title>${l} · entradas ${brl.format(ent[i])}</title></rect>`;
    if(sai[i])s+=`<rect x="${x}" y="${y(0)}" width="${w}" height="${y(sai[i])-y(0)}" rx="2" fill="var(--bad)" opacity=".75"><title>${l} · saídas ${brl.format(sai[i])}</title></rect>`;
    s+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${l}</text>`});
  const pts=acum.map((v,i)=>v==null?null:[L+i*bw+bw/2,y(v)]).filter(Boolean);
  s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  pts.forEach((p,i)=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="var(--accent)"><title>${labels[i]} · acumulado ${brl.format(acum[i])}</title></circle>`);
  return '<div class="chart-scroll">'+s+'</svg></div>';
}
function deltaChip(atual,ant,inverso=false){if(!ant)return'<span class="chip mute">sem base</span>';const d=(atual-ant)/Math.abs(ant);const bom=inverso?d<=0:d>=0;return `<span class="chip ${Math.abs(d)<.01?'mute':bom?'good':'bad'}">${d>=0?'▲':'▼'} ${pct(Math.abs(d))}</span>`}
function ppDiff(a,b){if(!isFinite(a)||!isFinite(b))return'';const d=(a-b)*100;return `<span class="chip ${Math.abs(d)<.2?'mute':d>0?'good':'bad'}">${d>0?'+':''}${d.toFixed(1).replace('.',',')} p.p.</span>`}
function cell(v,cls){return cls==='pct'?`<td class="n">${pct(v)}</td>`:`<td class="n ${v<0?'neg':''}">${num.format(Math.round(v))}</td>`}
function escopo(){const es=selEmp(),us=selUn(),all=unidades();return es.length===S.empresas.length&&us.length===all.length?(S.empresas.length>1?'Consolidado de todas as empresas':nomeEmp(es[0])||''):es.length===1?nomeEmp(es[0])+' · '+us.map(u=>u.nome).join(', '):`${es.length} empresas · ${us.length} unidades`}
function vazio(titulo,texto,acao=''){return `<div class="panel empty"><b>${titulo}</b>${texto}${acao?`<div style="margin-top:14px">${acao}</div>`:''}</div>`}
const semDados=()=>vazio('Nenhum lançamento neste período',`<p style="margin:0">Não há lançamentos em ${labelPer()} para ${esc(escopo())}. Troque o período ou importe dados antigos.</p>`,podeEditarAlguma()?'<a class="btn" href="#importar">Importar planilha</a>':'');

// ===================== Painel
async function vPainel(){
  const ant=perAnterior();
  const [atual,anterior,ano,anoAnt,abertas]=await Promise.all([lancDoPer(),lancDoPer(ant.a,ant.p),lancAno(S.ano),lancAno(S.ano-1),parcelasAbertas()]);
  if(!atual.length)return semDados();
  const d=dre(atual),dA=dre(anterior);
  const ps=abertas.filter(parcNaSel);
  const vencP=ps.filter(p=>p.vencimento<HOJE&&p.valor<0),vencR=ps.filter(p=>p.vencimento<HOJE&&p.valor>0);
  const sem=ps.filter(p=>p.vencimento>=HOJE&&p.vencimento<=addDias(HOJE,7));
  const tiles=[
    ['Receita bruta',k(d.rb),deltaChip(d.rb,dA.rb),'vs '+labelCurto(ant.a,ant.p)],
    ['Margem bruta',pct(d.mb),ppDiff(d.mb,dA.mb),'lucro bruto '+k(d.lb)],
    ['EBITDA',k(d.eb),deltaChip(d.eb,dA.eb),'margem '+pct(d.me)],
    ['Lucro líquido',k(d.ll),deltaChip(d.ll,dA.ll),'margem '+pct(d.ml)],
    ['Vencido em aberto',k(-sum(vencP.map(p=>p.valor))),vencP.length?`<span class="chip bad">${vencP.length} a pagar</span>`:'<span class="chip good">nada a pagar</span>',vencR.length?k(sum(vencR.map(p=>p.valor)))+' a receber':'']];
  const filtroUn=l=>naSel(l.empresa_id,l.predio_id);
  const recMes=MESES.map((_,i)=>dre(ano.filter(l=>filtroUn(l)&&l.competencia.slice(5,7)==String(i+1).padStart(2,'0'))).rb);
  const recAnt=MESES.map((_,i)=>dre(anoAnt.filter(l=>filtroUn(l)&&l.competencia.slice(5,7)==String(i+1).padStart(2,'0'))).rb);
  const hi=new Set(mesesDoPer().map(x=>+x.slice(5)-1));
  // por empresa e prédio
  let comp='';
  selEmp().forEach(e=>{const us=selUn().filter(u=>u.emp===e);const de=dre(atual.filter(l=>l.empresa_id===e.id));
    comp+=`<tr class="grp-row"><td>${esc(nomeEmp(e))}</td><td class="n">${k(de.rb)}</td><td class="n">${pct(de.mb)}</td><td class="n">${k(de.eb)}</td><td class="n ${de.ll<0?'neg':''}">${k(de.ll)}</td><td class="n">${pct(de.ml)}</td><td class="n">${pct(de.rb/d.rb)}</td></tr>`;
    if(us.length>1)us.forEach(u=>{const du=dre(atual.filter(l=>unidadeDe(l.empresa_id,l.predio_id)===u.key));if(!du.n)return;comp+=`<tr class="l3"><td>${esc(u.nome)}</td><td class="n">${k(du.rb)}</td><td class="n">${pct(du.mb)}</td><td class="n">${k(du.eb)}</td><td class="n ${du.ll<0?'neg':''}">${k(du.ll)}</td><td class="n">${pct(du.ml)}</td><td class="n">${pct(du.rb/d.rb)}</td></tr>`})});
  comp+=`<tr class="tot"><td>Total da seleção</td><td class="n">${k(d.rb)}</td><td class="n">${pct(d.mb)}</td><td class="n">${k(d.eb)}</td><td class="n">${k(d.ll)}</td><td class="n">${pct(d.ml)}</td><td class="n">100,0%</td></tr>`;
  // maiores despesas e centros de custo
  const porNome=C=>{const o={};for(const [id,v] of Object.entries(C)){const c=conta(id);const key=c?c.codigo+' '+c.nome:'?';o[key]=(o[key]||0)+v}return o};
  const desp=Object.entries(porNome(d.contas)).filter(([,v])=>v<0).sort((a,b)=>a[1]-b[1]).slice(0,8);const maxD=Math.abs(desp[0]?.[1]||1);
  const dAntC=porNome(dA.contas);
  const porCC={};atual.filter(l=>l.valor<0).forEach(l=>{const n=centro(l.centro_custo_id)?.nome||'Sem centro de custo';porCC[n]=(porCC[n]||0)+ +l.valor});
  const cc=Object.entries(porCC).sort((a,b)=>a[1]-b[1]);const totCC=sum(cc.map(x=>x[1]))||1;
  const alerts=[];
  if(vencP.length)alerts.push(['bad','#contas',`${vencP.length} conta${vencP.length>1?'s':''} a pagar vencida${vencP.length>1?'s':''}`,brl.format(-sum(vencP.map(p=>p.valor)))+' em aberto']);
  if(vencR.length)alerts.push(['warn','#contas',`${vencR.length} recebimento${vencR.length>1?'s':''} atrasado${vencR.length>1?'s':''}`,brl.format(sum(vencR.map(p=>p.valor)))+' a receber']);
  alerts.push(['accent','#contas',`${sem.length} vencimento${sem.length===1?'':'s'} nos próximos 7 dias`,`${brl.format(-sum(sem.filter(p=>p.valor<0).map(p=>p.valor)))} a pagar · ${brl.format(sum(sem.filter(p=>p.valor>0).map(p=>p.valor)))} a receber`]);
  if(d.semGrupo)alerts.push(['warn','#plano','Lançamentos em contas sem grupo da DRE',brl.format(d.semGrupo)+' fora da DRE. Defina o grupo no plano de contas.']);
  const semPred=atual.filter(l=>!l.predio_id&&S.predios.some(p=>p.empresa_id===l.empresa_id));
  if(semPred.length)alerts.push(['warn','#lancamentos',`${semPred.length} lançamento${semPred.length>1?'s':''} sem prédio`,'Ficam fora da visão por prédio.']);
  return `
  <section class="grid g-tiles">${tiles.map(t=>`<div class="tile"><div class="lbl">${t[0]}</div><div class="val">${t[1]}</div><div class="cmp">${t[2]}<span>${t[3]}</span></div></div>`).join('')}</section>
  <section class="grid g-2">
    <div class="panel"><div class="ph"><div><h2>Receita bruta por mês · ${S.ano}</h2><p class="hint">Barras fortes: ${labelPer()}. Linha: ${S.ano-1}.</p></div></div>
      ${chartBarsLine({labels:MESES,bars:recMes,line:recAnt,hi,nomeBar:'Receita '+S.ano,nomeLine:'Receita '+(S.ano-1)})}
      <div class="legend"><span><i style="background:var(--accent)"></i>${S.ano}</span><span><i style="background:var(--ink-2)"></i>${S.ano-1}</span></div></div>
    <div class="panel"><h2>Precisa de atenção</h2><p class="hint">${esc(escopo())}</p><div class="alerts">
      ${alerts.map(a=>`<a class="alert" href="${a[1]}" style="color:inherit;text-decoration:none"><span class="dot" style="background:var(--${a[0]})"></span><div><b>${a[2]}</b><small>${a[3]}</small></div></a>`).join('')}
    </div></div>
  </section>
  <div class="panel"><div class="ph"><div><h2>Resultado por empresa e prédio</h2><p class="hint">${labelPer()} · regime de competência</p></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Empresa / prédio</th><th class="n">Receita bruta</th><th class="n">Margem bruta</th><th class="n">EBITDA</th><th class="n">Lucro líquido</th><th class="n">Margem líq.</th><th class="n">% da receita</th></tr></thead><tbody>${comp}</tbody></table></div></div>
  <section class="grid g-2e">
    <div class="panel"><h2>Maiores despesas</h2><p class="hint">${labelPer()} · comparado com ${labelCurto(ant.a,ant.p)}</p>
      ${desp.length?`<div class="tbl-wrap"><table><thead><tr><th>Conta</th><th class="n">Valor</th><th></th><th class="n">Variação</th></tr></thead><tbody>
      ${desp.map(([id,v])=>{return `<tr><td>${esc(id)}</td><td class="n">${num.format(Math.round(-v))}</td><td><div class="bar-cell"><span style="width:${Math.round(80*Math.abs(v)/maxD)}px"></span></div></td><td class="n">${deltaChip(-v,-(dAntC[id]||0),true)}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">Sem despesas no período.</p>'}</div>
    <div class="panel"><h2>Despesas por centro de custo</h2><p class="hint">${labelPer()} · custos e despesas</p>
      ${cc.length?`<div class="tbl-wrap"><table><thead><tr><th>Centro de custo</th><th class="n">Valor</th><th class="n">% do total</th><th></th></tr></thead><tbody>
      ${cc.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="n">${num.format(Math.round(-v))}</td><td class="n">${pct(v/totCC)}</td><td><div class="bar-cell"><span style="width:${Math.round(90*v/totCC)}px"></span></div></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Sem despesas no período.</p>'}</div>
  </section>`;
}

// ===================== DRE
async function vDRE(){
  const atual=await lancDoPer();
  if(!atual.length)return semDados();
  let cols;
  if(S.dreModo==='mes'){const ms=mesesDoPer();cols=ms.length>1?ms.map(m=>({nome:MESES[+m.slice(5)-1]+'/'+m.slice(2,4),ls:atual.filter(l=>l.competencia.startsWith(m))})):[];cols.push({nome:ms.length>1?'Total':labelCurto(),ls:atual,tot:true})}
  else if(S.dreModo==='unid'){cols=selUn().map(u=>({nome:(S.empresas.length>1?nomeEmp(u.emp)+'\n':'')+u.nome,ls:atual.filter(l=>unidadeDe(l.empresa_id,l.predio_id)===u.key)})).filter(c=>c.ls.length);cols.push({nome:'Total',ls:atual,tot:true})}
  else{const ant=perAnterior();const [la,ly]=await Promise.all([lancDoPer(ant.a,ant.p),lancDoPer(S.ano-1,S.per)]);
    cols=[{nome:labelCurto(),ls:atual,tot:true},{nome:labelCurto(ant.a,ant.p),ls:la,var:0},{nome:labelCurto(S.ano-1,S.per),ls:ly,var:0}]}
  const D=cols.map(c=>dre(c.ls));const T=D[cols.findIndex(c=>c.tot)];
  const comp=S.dreModo==='comp';
  const head=`<tr><th>Linha</th>${cols.map((c,i)=>`<th class="n">${c.nome.split('\n').map((x,j)=>j?`<span class="unit">${esc(x)}</span>`:esc(x)).join('')}</th>${comp&&i>0?'<th class="n">Var.</th>':''}`).join('')}${comp?'':'<th class="n">% RL</th>'}</tr>`;
  const zero=key=>D.every(d=>!d[key]);
  let rows='';
  for(const [n,key,cls,grupos] of LINHAS_DRE){
    if((key==='ou'||key==='ir')&&zero(key))continue;if(key==='lair'&&zero('ou')&&zero('ir'))continue;
    const aberto=grupos&&S.abertos.has(key);
    rows+=`<tr class="${cls}${grupos?' click':''}" ${grupos?`data-abre="${key}"`:''}><td>${grupos?(aberto?'▾ ':'▸ '):''}${n}</td>${D.map((d,i)=>cell(d[key],cls)+(comp&&i>0?`<td class="n">${cls==='pct'?ppDiff(D[0][key],d[key]):deltaChip(D[0][key],d[key])}</td>`:'')).join('')}${comp?'':`<td class="n">${cls==='pct'?'':pct(T[key]/T.rl)}</td>`}</tr>`;
    if(aberto){const ids=S.contas.filter(c=>grupos.includes(c.grupo_dre)&&D.some(d=>d.contas[c.id])).sort((a,b)=>a.codigo.localeCompare(b.codigo));
      const vistos=new Set();
      ids.forEach(c=>{const chave=c.codigo+' '+c.nome;if(vistos.has(chave))return;vistos.add(chave);const mesmas=ids.filter(x=>x.codigo+' '+x.nome===chave).map(x=>x.id);const v=d=>sum(mesmas.map(id=>d.contas[id]||0));
        rows+=`<tr class="l3"><td>${esc(c.codigo)} ${esc(c.nome)}</td>${D.map((d,i)=>cell(v(d),'')+(comp&&i>0?`<td class="n">${deltaChip(v(D[0]),v(d))}</td>`:'')).join('')}${comp?'':`<td class="n">${pct(v(T)/T.rl)}</td>`}</tr>`})}
  }
  return `<div class="panel"><div class="ph"><div><h2>Demonstração do resultado · ${labelPer()}</h2><p class="hint">Regime de competência · ${esc(escopo())} · clique numa linha com ▸ para ver as contas</p></div>
    <div class="seg" role="group" aria-label="Visão da DRE"><button data-dre="mes" class="${S.dreModo==='mes'?'on':''}">Por mês</button><button data-dre="unid" class="${S.dreModo==='unid'?'on':''}">Por empresa e prédio</button><button data-dre="comp" class="${S.dreModo==='comp'?'on':''}">Comparativo</button></div></div>
    <div class="tbl-wrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>
    ${T.semGrupo?`<p class="chip warn" style="margin-top:10px;white-space:normal">${brl.format(T.semGrupo)} lançados em contas sem grupo da DRE não aparecem acima. Ajuste no plano de contas.</p>`:''}
    ${comp?'<p class="muted" style="font-size:12.5px;margin:10px 0 0">Variação: período atual contra o período anterior e contra o mesmo período do ano passado. Quando o orçamento for ativado, ele entra nesta comparação.</p>':''}</div>`;
}
</script>
<script>
// ===================== Fluxo de caixa (realizado pelas parcelas pagas)
async function vFluxo(){
  const [pagas,abertas]=await Promise.all([parcelasPagas(S.ano),parcelasAbertas()]);
  const ps=pagas.filter(parcNaSel);
  const ab=abertas.filter(p=>parcNaSel(p)&&p.vencimento.startsWith(String(S.ano)));
  if(!ps.length&&!ab.length)return vazio('Nenhum pagamento ou recebimento em '+S.ano,'<p style="margin:0">O fluxo de caixa usa as parcelas com data de pagamento. Lançamentos importados com “Data Pagamento” aparecem aqui.</p>',podeEditarAlguma()?'<a class="btn" href="#importar">Importar planilha</a>':'');
  const ent=Array(12).fill(0),sai=Array(12).fill(0),pEnt=Array(12).fill(0),pSai=Array(12).fill(0);
  ps.forEach(p=>{const m=+p.data_pagamento.slice(5,7)-1,v=+(p.valor_pago??p.valor);v>=0?ent[m]+=v:sai[m]+=v});
  ab.forEach(p=>{const m=+p.vencimento.slice(5,7)-1,v=+p.valor;v>=0?pEnt[m]+=v:pSai[m]+=v});
  let a=0;const ultimo=Math.max(...ent.map((e,i)=>e||sai[i]?i:-1));const acum=ent.map((e,i)=>i>ultimo?null:(a+=e+sai[i]));
  const porConta={};ps.forEach(p=>{const c=conta(p.lancamentos.conta_id);const key=c?c.codigo+' '+c.nome:'Sem conta';porConta[key]=porConta[key]||Array(12).fill(0);porConta[key][+p.data_pagamento.slice(5,7)-1]+=+(p.valor_pago??p.valor)});
  const linhas=Object.entries(porConta).sort((x,y)=>x[0].localeCompare(y[0]));
  const tE=sum(ent),tS=sum(sai);
  return `<section class="grid g-tiles" style="grid-template-columns:repeat(4,minmax(0,1fr))">
    <div class="tile"><div class="lbl">Entradas ${S.ano}</div><div class="val">${k(tE)}</div><div class="cmp">recebido</div></div>
    <div class="tile"><div class="lbl">Saídas ${S.ano}</div><div class="val">${k(-tS)}</div><div class="cmp">pago</div></div>
    <div class="tile"><div class="lbl">Geração de caixa</div><div class="val">${k(tE+tS)}</div><div class="cmp">${tE+tS>=0?'<span class="chip good">positiva</span>':'<span class="chip bad">negativa</span>'}</div></div>
    <div class="tile"><div class="lbl">Em aberto no ano</div><div class="val">${k(sum(pEnt)+sum(pSai))}</div><div class="cmp">${k(sum(pEnt))} a receber · ${k(-sum(pSai))} a pagar</div></div></section>
  <div class="panel"><h2>Entradas e saídas por mês · ${S.ano}</h2><p class="hint">Regime de caixa, pela data de pagamento · ${esc(escopo())}</p>${chartFluxo({labels:MESES,ent,sai,acum})}
    <div class="legend"><span><i style="background:var(--good)"></i>Entradas</span><span><i style="background:var(--bad)"></i>Saídas</span><span><i style="background:var(--accent)"></i>Geração de caixa acumulada</span></div></div>
  <div class="panel"><h2>Fluxo de caixa realizado por conta</h2><p class="hint">Valores pagos e recebidos. A última linha mostra o que ainda vence em cada mês.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Conta</th>${MESES.map(m=>`<th class="n">${m}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>
    ${linhas.map(([n,v])=>`<tr class="l3"><td>${esc(n)}</td>${v.map(x=>`<td class="n ${x<0?'neg':''}">${x?num.format(Math.round(x)):''}</td>`).join('')}<td class="n ${sum(v)<0?'neg':''}">${num.format(Math.round(sum(v)))}</td></tr>`).join('')}
    <tr class="tot"><td>Entradas</td>${ent.map(x=>`<td class="n">${num.format(Math.round(x))}</td>`).join('')}<td class="n">${num.format(Math.round(tE))}</td></tr>
    <tr class="tot"><td>Saídas</td>${sai.map(x=>`<td class="n neg">${num.format(Math.round(x))}</td>`).join('')}<td class="n neg">${num.format(Math.round(tS))}</td></tr>
    <tr class="tot"><td>Saldo do mês</td>${ent.map((x,i)=>`<td class="n ${x+sai[i]<0?'neg':''}">${num.format(Math.round(x+sai[i]))}</td>`).join('')}<td class="n">${num.format(Math.round(tE+tS))}</td></tr>
    <tr class="pct"><td>Em aberto (a vencer ou vencido)</td>${pEnt.map((x,i)=>`<td class="n">${x+pSai[i]?num.format(Math.round(x+pSai[i])):''}</td>`).join('')}<td class="n">${num.format(Math.round(sum(pEnt)+sum(pSai)))}</td></tr>
    </tbody></table></div></div>`;
}

// ===================== Contas a pagar e receber
function statusParcela(p){if(p.vencimento<HOJE)return['Vencida','bad'];if(p.vencimento===HOJE)return['Vence hoje','warn'];if(p.vencimento<=addDias(HOJE,7))return['Próx. 7 dias','info'];return['Aberta','mute']}
async function vContas(){
  const ab=(await parcelasAbertas()).filter(parcNaSel);
  const lado=S.cpLado==='pagar'?ab.filter(p=>p.valor<0):ab.filter(p=>p.valor>0);
  const venc=lado.filter(p=>p.vencimento<HOJE),sem=lado.filter(p=>p.vencimento>=HOJE&&p.vencimento<=addDias(HOJE,7)),mes=lado.filter(p=>p.vencimento.slice(0,7)===HOJE.slice(0,7));
  const tot=v=>brl.format(Math.abs(sum(v.map(p=>p.valor))));
  return `<section class="grid g-tiles" style="grid-template-columns:repeat(4,minmax(0,1fr))">
    <div class="tile"><div class="lbl">Em aberto</div><div class="val">${tot(lado)}</div><div class="cmp">${lado.length} parcelas</div></div>
    <div class="tile"><div class="lbl">Vencido</div><div class="val">${tot(venc)}</div><div class="cmp">${venc.length?`<span class="chip bad">${venc.length} parcelas</span>`:'<span class="chip good">nada vencido</span>'}</div></div>
    <div class="tile"><div class="lbl">Próximos 7 dias</div><div class="val">${tot(sem)}</div><div class="cmp">${sem.length} parcelas</div></div>
    <div class="tile"><div class="lbl">Vence neste mês</div><div class="val">${tot(mes)}</div><div class="cmp">${MESES[+HOJE.slice(5,7)-1]}/${HOJE.slice(0,4)}</div></div></section>
  <div class="panel"><div class="ph"><div><h2>Parcelas em aberto</h2><p class="hint">${esc(escopo())} · todas as datas</p></div>
    <div class="seg" role="group" aria-label="Pagar ou receber"><button data-cp="pagar" class="${S.cpLado==='pagar'?'on':''}">A pagar</button><button data-cp="receber" class="${S.cpLado==='receber'?'on':''}">A receber</button></div></div>
    ${lado.length?`<div class="tbl-wrap"><table><thead><tr><th>Vencimento</th><th>Situação</th><th>Parceiro / descrição</th><th>Conta</th><th>Empresa / prédio</th><th class="n">Valor</th><th></th></tr></thead><tbody>
    ${lado.slice(0,500).map(p=>{const [st,c]=statusParcela(p);const l=p.lancamentos;const ct=conta(l.conta_id);return `<tr><td class="mono">${dataBR(p.vencimento)}</td><td><span class="chip ${c}">${st}</span></td><td>${esc(parceiro(l.parceiro_id)?.nome||'')}<span class="unit">${esc(l.descricao||'')}${p.numero>1?' · parcela '+p.numero:''}</span></td><td>${esc(ct?.codigo)} ${esc(ct?.nome)}</td><td>${esc(nomeEmp(empresa(p.empresa_id)))}<span class="unit">${esc(predio(l.predio_id)?.nome||'')}</span></td><td class="n">${brl2.format(Math.abs(p.valor))}</td><td>${podeEditar(p.empresa_id)?`<button class="btn ghost" data-acao="baixar" data-id="${p.id}">${p.valor<0?'Pagar':'Receber'}</button>`:''}</td></tr>`}).join('')}
    </tbody></table></div>${lado.length>500?`<p class="muted">Mostrando as 500 primeiras de ${lado.length}.</p>`:''}`:'<p class="muted">Nenhuma parcela em aberto.</p>'}</div>`;

 ['Valor','Sim','-8.520,00','Receita positiva, despesa negativa'],
 ['Banco','Se pago','Itaú','Obrigatório quando há data de pagamento'],

function parseValor(v){if(typeof v==='number')return v;const s=String(v??'').trim().replace(/[R$\s]/g,'');if(!s)return NaN;if(/,\d{1,2}$/.test(s))return parseFloat(s.replace(/\./g,'').replace(',','.'));return parseFloat(s.replace(/,/g,''))}
function parseDataImp(v){
  if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.toISOString().slice(0,10)}
  const s=String(v||'').trim();if(!s)return '';
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m){const iso=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;const d=new Date(iso+'T12:00:00Z');return isNaN(d)||d.toISOString().slice(0,10)!==iso?'invalida':iso}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];return 'invalida';
}
function acharCentro(empId,txt){const t=norm(txt);return S.centros.find(c=>c.empresa_id===empId&&(norm(c.nome)===t||norm(c.codigo)===t))}
function validarLinha(o){
  const erros=[],avisos=[],r={};
  const e=S.empresas.find(x=>soDig(x.cnpj)===soDig(o['CNPJ Empresa']));r.emp=e;
  if(!e)erros.push('Empresa '+o['CNPJ Empresa']+' não cadastrada ou sem acesso');
  else{
    if(!podeEditar(e.id))erros.push('Sem permissão para gravar na '+nomeEmp(e));
    const pn=String(o['Prédio']||'').trim();
    if(pn){r.predio=S.predios.find(p=>p.empresa_id===e.id&&norm(p.nome)===norm(pn));if(!r.predio)erros.push(`Prédio “${pn}” não cadastrado na ${nomeEmp(e)}`)}
    else if(S.predios.some(p=>p.empresa_id===e.id))avisos.push('Sem prédio: fica na empresa toda');
    const cod=String(o['Conta Contábil']||'').trim();r.conta=S.contas.find(c=>c.empresa_id===e.id&&c.codigo===cod);
    if(!cod)erros.push('Falta a conta contábil');else if(!r.conta)erros.push('Conta '+cod+' não existe no plano da '+nomeEmp(e));else if(!r.conta.analitica)erros.push('Conta '+cod+' é sintética');
    const cc=String(o['Centro de Custo']||'').trim();
    if(!cc)erros.push('Falta o centro de custo');else{r.centro=acharCentro(e.id,cc);if(!r.centro){r.centroNovo=cc;avisos.push(`Centro de custo “${cc}” será criado`)}}
    const pr=String(o['Produto/Serviço']||'').trim();if(pr){r.produto=S.produtos.find(p=>p.empresa_id===e.id&&norm(p.codigo)===norm(pr));if(!r.produto)avisos.push(`Produto ${pr} não cadastrado: importa sem produto`)}
  }
  r.comp=parseDataImp(o['Data Competência']);if(!r.comp)erros.push('Falta a data de competência');else if(r.comp==='invalida')erros.push('Data de competência inválida: '+o['Data Competência']);
  r.venc=parseDataImp(o['Data Vencimento']);if(r.venc==='invalida')erros.push('Data de vencimento inválida');
  r.pag=parseDataImp(o['Data Pagamento']);if(r.pag==='invalida')erros.push('Data de pagamento inválida');
  r.valor=parseValor(o['Valor']);if(isNaN(r.valor)||!r.valor)erros.push('Valor vazio ou inválido');
  else if(r.conta&&((r.conta.tipo==='despesa'&&r.valor>0)||(r.conta.tipo==='receita'&&r.valor<0)))avisos.push(`Valor ${r.valor>0?'positivo':'negativo'} em conta de ${r.conta.tipo}: confira o sinal`);
  if(r.pag&&r.pag!=='invalida'){
    if(!String(o['Conta Corrente']||'').trim())erros.push('Pago sem banco, agência e conta');
    else if(e){r.banco=S.bancos.find(b=>b.empresa_id===e.id&&soDig(b.conta)===soDig(o['Conta Corrente'])&&(!soDig(o['Agência'])||soDig(b.agencia)===soDig(o['Agência'])));
      if(!r.banco)erros.push('Conta corrente '+o['Conta Corrente']+' não cadastrada na '+nomeEmp(e))}}
  else if(!r.pag)avisos.push('Sem data de pagamento: entra como parcela em aberto');
  return {erros,avisos,...r};
}
function carregarImport(rows,origem){
  const head=Object.keys(rows[0]||{});const falta=COLS_IMP.filter(c=>c[1]==='Sim'&&!head.some(h=>norm(h)===norm(c[0]))).map(c=>c[0]);
  const campo=(r,n)=>{const h=head.find(h=>norm(h)===norm(n));return h!=null?String(r[h]??'').trim():''};
  // linhas só com o CNPJ preenchido (modelo com 500 linhas prontas) não contam
  rows=rows.filter(r=>['Data Competência','Conta Contábil','Valor','Descrição'].some(n=>campo(r,n)!==''));
  const lin=rows.map(r=>{const o={};COLS_IMP.forEach(c=>{const h=head.find(h=>norm(h)===norm(c[0]));o[c[0]]=h!=null?r[h]:''});return {o,...validarLinha(o)}});
  S.imp={origem,falta,lin,feito:false,progresso:''};
}
function lerPlanilha(f){
  const fr=new FileReader();
  if(/\.csv$/i.test(f.name)){fr.onload=()=>{const t=fr.result;const ls=t.split(/\r?\n/).filter(l=>l.trim());const sep=ls[0].includes(';')?';':',';const h=ls[0].split(sep).map(x=>x.replace(/^"|"$/g,'').trim());
    carregarImport(ls.slice(1).map(l=>{const c=l.split(sep).map(x=>x.replace(/^"|"$/g,'').trim());return Object.fromEntries(h.map((x,i)=>[x,c[i]??'']))}),f.name);render()};fr.readAsText(f);return}
  if(!window.XLSX){toast('O leitor de Excel não carregou. Salve a planilha como CSV e envie de novo.');return}
  fr.onload=()=>{try{const wb=XLSX.read(new Uint8Array(fr.result),{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames.find(n=>/LANC/.test(norm(n)))||wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});if(!rows.length)throw new Error('A planilha está vazia.');carregarImport(rows,f.name);render()}catch(err){toast('Não consegui ler a planilha: '+err.message)}};
  fr.readAsArrayBuffer(f);
}

async function inserirLotes(tabela,linhas,tam=500){for(let i=0;i<linhas.length;i+=tam){const {error}=await sb.from(tabela).insert(linhas.slice(i,i+tam));if(error)throw error;if(S.imp){S.imp.progresso=`Gravando ${tabela}… ${Math.min(i+tam,linhas.length)}/${linhas.length}`;render(true)}}}
function codigoCentro(nome,usados){let base=norm(nome).replace(/[^A-Z0-9]/g,'').slice(0,3)||'CC';let c=base,i=2;while(usados.has(c))c=base+(i++);usados.add(c);return c}
async function executarImport(){

}

<script>
// ===================== Faturamento, maquininha e impostos
const FORMAS={dinheiro:'Dinheiro',pix:'PIX',boleto:'Boleto',transferencia:'Transferência',debito:'Cartão de débito',credito_vista:'Crédito à vista',credito_parcelado:'Crédito parcelado',voucher:'Voucher'};
const CARTAO=new Set(['debito','credito_vista','credito_parcelado','voucher','pix']);
const MODALIDADES={debito:'Débito',credito_vista:'Crédito à vista',credito_parcelado:'Crédito parcelado',pix:'PIX na maquininha',voucher:'Voucher'};
const REGIMES={simples_nacional:'Simples Nacional',lucro_presumido:'Lucro Presumido',lucro_real:'Lucro Real'};
const ATIVIDADES={servicos:'Serviços',comercio:'Comércio',locacao:'Locação e administração de imóveis',misto:'Comércio e serviços'};
// modelos de impostos: [imposto, periodicidade, alíquota %, presunção %, adicional %, limite adicional, dia, conta]
function modeloImpostos(regime,ativ){
  const ir=p=>[['IRPJ','trimestral',15,p[0],10,60000,31,'7.01.001'],['CSLL','trimestral',9,p[1],null,null,31,'7.01.002']];
  if(regime==='simples_nacional')return [['DAS','mensal',6,null,null,null,20,'3.02.001']];
  if(regime==='lucro_real')return [['PIS','mensal',1.65,null,null,null,25,'3.02.003'],['COFINS','mensal',7.6,null,null,null,25,'3.02.003'],...(ativ==='comercio'||ativ==='misto'?[['ICMS','mensal',4,null,null,null,20,'3.02.005']]:[]),...(ativ==='servicos'||ativ==='misto'?[['ISS','mensal',5,null,null,null,15,'3.02.004']]:[]),['IRPJ','trimestral',15,null,10,60000,31,'7.01.001'],['CSLL','trimestral',9,null,null,null,31,'7.01.002']];
  const pc=[['PIS','mensal',.65,null,null,null,25,'3.02.003'],['COFINS','mensal',3,null,null,null,25,'3.02.003']];
  if(ativ==='comercio')return [...pc,['ICMS','mensal',4,null,null,null,20,'3.02.005'],...ir([8,12])];
  if(ativ==='locacao')return [...pc,...ir([32,32])];
  if(ativ==='misto')return [...pc,['ISS','mensal',5,null,null,null,15,'3.02.004'],['ICMS','mensal',4,null,null,null,20,'3.02.005'],...ir([8,12])];
  return [...pc,['ISS','mensal',5,null,null,null,15,'3.02.004'],...ir([32,32])];
}
const contaCod=(emp,cod)=>S.contas.find(c=>c.empresa_id===emp&&c.codigo===cod);
const grupoDe=l=>conta(l.conta_id)?.grupo_dre;
const ehFat=l=>grupoDe(l)==='receita_bruta';
function vencDia(ano,mes0,dia){const ult=new Date(Date.UTC(ano,mes0+1,0)).getUTCDate();const d=new Date(Date.UTC(ano,mes0,Math.min(dia,ult)));while([0,6].includes(d.getUTCDay()))d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}
const fimMes=(a,m)=>new Date(Date.UTC(a,m+1,0)).toISOString().slice(0,10);
const configsDe=(emp,ini)=>S.impostos.filter(c=>c.empresa_id===emp&&c.vigencia_inicio<=ini&&(!c.vigencia_fim||c.vigencia_fim>=ini));
// Apuração calculada de uma empresa (CNPJ inteiro) num ano; cada linha traz a distribuição do valor pelos meses
function apurarEmpresa(e,lsEmp,ano){
  const fat=Array(12).fill(0);lsEmp.forEach(l=>{if(ehFat(l))fat[+l.competencia.slice(5,7)-1]+=+l.valor});
  const out=[];const ini0=ano+'-01-01';
  for(const c of S.impostos.filter(c=>c.empresa_id===e.id)){
    const per=c.periodicidade==='trimestral'?[0,1,2,3].map(q=>[3*q,3*q+2]):[...Array(12).keys()].map(m=>[m,m]);
    for(const [m0,m1] of per){
      const ini=ym(ano,m0)+'-01';if(!configsDe(e.id,ini).includes(c))continue;
      const fatP=sum(fat.slice(m0,m1+1));let base,valor;
      if(c.presuncao!=null||!['IRPJ','CSLL'].includes(c.imposto)){base=fatP*(c.presuncao!=null?c.presuncao/100:1)}
      else{const ms=new Set([...Array(m1-m0+1).keys()].map(i=>ym(ano,m0+i)));base=Math.max(0,dre(lsEmp.filter(l=>ms.has(l.competencia.slice(0,7)))).lair)}
      if(!fatP&&!base)continue;
      valor=base*c.aliquota/100+(c.adicional_aliquota?Math.max(0,base-(+c.adicional_limite||0))*c.adicional_aliquota/100:0);
      const pm=new Date(Date.UTC(ano,m1+1,1));
      const venc=vencDia(pm.getUTCFullYear(),pm.getUTCMonth(),c.dia_vencimento);
      const dist=Array(12).fill(0);for(let m=m0;m<=m1;m++)dist[m]=fatP?valor*fat[m]/fatP:valor/(m1-m0+1);
      const ap=S.apuracoes.find(a=>a.empresa_id===e.id&&a.imposto===c.imposto&&a.periodo_inicio===ini);
      out.push({emp:e,cfg:c,imposto:c.imposto,trimestral:c.periodicidade==='trimestral',ini,fim:fimMes(ano,m1),m0,m1,fat:fatP,base,valor:r2(valor),venc,dist,ap,sobreLucro:['IRPJ','CSLL'].includes(c.imposto)});
    }
  }
  return {rows:out,fat};
}
async function carregarApuracoes(){const {data,error}=await sb.from('apuracoes').select('*');if(error)throw error;S.apuracoes=data}
async function dadosFat(ano){
  const [ls,lsAnt]=await Promise.all([lancAno(ano),lancAno(ano-1)]);
  if(!S.apuracoes)await carregarApuracoes();
  const emp={};
  for(const e of selEmp()){
    const a=apurarEmpresa(e,ls.filter(l=>l.empresa_id===e.id),ano),b=apurarEmpresa(e,lsAnt.filter(l=>l.empresa_id===e.id),ano-1);
    const fatSel=Array(12).fill(0);ls.forEach(l=>{if(l.empresa_id===e.id&&ehFat(l)&&naSel(l.empresa_id,l.predio_id))fatSel[+l.competencia.slice(5,7)-1]+=+l.valor});
    const share=a.fat.map((f,m)=>f?fatSel[m]/f:0);
    emp[e.id]={e,rows:a.rows,rowsAnt:b.rows,fat:a.fat,fatSel,share};
  }
  return {ls,emp};
}
// valor de impostos por mês na seleção (rateado pela participação dos prédios marcados no faturamento da empresa)
function impostosMes(D,filtro){const out=Array(12).fill(0);Object.values(D.emp).forEach(x=>x.rows.filter(filtro).forEach(r=>r.dist.forEach((v,m)=>out[m]+=v*x.share[m])));return out}

function chartStack({labels,series,hi,total}){
  const W=1100,H=280,L=64,R_=12,T=14,B=28,iw=W-L-R_,ih=H-T-B;
  const tot=labels.map((_,i)=>sum(series.map(s=>Math.max(0,s.vals[i]))));const max=(Math.max(1,...tot,...(total||[])))*1.08;
  const n=labels.length,bw=iw/n,y=v=>T+ih-(v/max)*ih,step=niceStep(max/4);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Composição do faturamento por mês">`;
  for(let t=0;t<=max;t+=step)s+=`<line x1="${L}" x2="${W-R_}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${k(t).replace('R$ ','')}</text>`;
  labels.forEach((l,i)=>{let acc=0;const x=L+i*bw+bw*.2,w=bw*.6;
    series.forEach(se=>{const v=Math.max(0,se.vals[i]);if(!v)return;s+=`<rect x="${x}" y="${y(acc+v)}" width="${w}" height="${Math.max(0,y(acc)-y(acc+v)-1)}" fill="${se.cor}" opacity="${hi.has(i)?1:.45}"><title>${l} · ${esc(se.nome)}: ${brl.format(v)}</title></rect>`;acc+=v});
    s+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="${hi.has(i)?'var(--ink)':'var(--ink-3)'}" font-weight="${hi.has(i)?600:400}">${l}</text>`});
  return '<div class="chart-scroll">'+s+'</svg></div>';
}
function chartAnos({labels,atual,novo}){
  const W=1100,H=260,L=64,R_=12,T=14,B=28,iw=W-L-R_,ih=H-T-B;const max=Math.max(1,...atual,...novo)*1.1;const n=labels.length,bw=iw/n,y=v=>T+ih-(v/max)*ih,step=niceStep(max/4);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Impostos sobre o faturamento: hoje e com a reforma, por ano">`;
  for(let t=0;t<=max;t+=step)s+=`<line x1="${L}" x2="${W-R_}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${k(t).replace('R$ ','')}</text>`;
  labels.forEach((l,i)=>{const x=L+i*bw+bw*.18,w=bw*.3;
    s+=`<rect x="${x}" y="${y(atual[i])}" width="${w}" height="${y(0)-y(atual[i])}" rx="2" fill="var(--plan)"><title>${l} · regras de hoje: ${brl.format(atual[i])}</title></rect>`;
    s+=`<rect x="${x+w+2}" y="${y(novo[i])}" width="${w}" height="${y(0)-y(novo[i])}" rx="2" fill="${novo[i]>atual[i]*1.005?'var(--bad)':novo[i]<atual[i]*.995?'var(--good)':'var(--accent)'}"><title>${l} · com a reforma: ${brl.format(novo[i])}</title></rect>`;
    s+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${l}</text>`});
  return '<div class="chart-scroll">'+s+'</svg></div>';
}

async function vFaturamento(){
  const D=await dadosFat(S.ano);const ms=mesesDoPer();const MS=new Set(ms);const idx=ms.map(m=>+m.slice(5)-1);
  const ant=perAnterior();const Dant=ant.a===S.ano?D:await dadosFat(ant.a);
  const lsP=D.ls.filter(l=>MS.has(l.competencia.slice(0,7))&&naSel(l.empresa_id,l.predio_id));
  const fatL=lsP.filter(ehFat),taxL=lsP.filter(l=>l.origem==='taxa_cartao');
  const bruto=sum(fatL.map(l=>l.valor));
  const brutoAnt=sum(Dant.ls.filter(l=>new Set(mesesDoPer(ant.a,ant.p)).has(l.competencia.slice(0,7))&&naSel(l.empresa_id,l.predio_id)&&ehFat(l)).map(l=>l.valor));
  const taxas=-sum(taxL.map(l=>l.valor));
  const impM=impostosMes(D,r=>!r.sobreLucro),irM=impostosMes(D,r=>r.sobreLucro);
  const imp=sum(idx.map(m=>impM[m])),ir=sum(idx.map(m=>irM[m]));
  const liq=bruto-taxas-imp-ir;
  const semConfig=selEmp().filter(e=>!S.impostos.some(c=>c.empresa_id===e.id));
  const aviso=semConfig.length?`<div class="panel" style="border-color:var(--warn)"><b>Configure os impostos de ${semConfig.map(e=>esc(nomeEmp(e))).join(', ')}</b><p class="hint" style="margin:4px 0 0">Sem o regime tributário o sistema não calcula os impostos dessa empresa. ${podeEditarAlguma()?'<a href="#tributos">Configurar agora</a>':''}</p></div>`:'';
  if(!bruto&&!fatL.length)return aviso+vazio('Nenhum faturamento em '+labelPer(),'<p style="margin:0">O faturamento vem dos lançamentos em contas de receita bruta (pela data de emissão da NF). Registre uma venda ou importe dados antigos.</p>',podeEditarAlguma()?'<button class="btn" data-acao="novo-fat">Registrar faturamento</button>':'');
  // série mensal do ano
  const fatAno=Array(12).fill(0),taxAno=Array(12).fill(0);D.ls.filter(l=>naSel(l.empresa_id,l.predio_id)).forEach(l=>{const m=+l.competencia.slice(5,7)-1;if(ehFat(l))fatAno[m]+=+l.valor;if(l.origem==='taxa_cartao')taxAno[m]-=+l.valor});
  const liqAno=fatAno.map((f,m)=>f-taxAno[m]-impM[m]-irM[m]);
  // por forma
  const porForma={};fatL.forEach(l=>{const f=l.forma_recebimento||'nao_informado';const o=porForma[f]=porForma[f]||{n:0,v:0,t:0};o.n++;o.v+= +l.valor});
  taxL.forEach(t=>{const r=D.ls.find(l=>l.id===t.vinculo_id);const f=r?.forma_recebimento||'nao_informado';const o=porForma[f]=porForma[f]||{n:0,v:0,t:0};o.t-= +t.valor});
  const formas=Object.entries(porForma).sort((a,b)=>b[1].v-a[1].v);
  // por empresa
  const porEmp=Object.values(D.emp).map(x=>{const b=sum(idx.map(m=>x.fatSel[m]));const im=sum(x.rows.filter(r=>!r.sobreLucro).map(r=>sum(idx.map(m=>r.dist[m]*x.share[m]))));const i2=sum(x.rows.filter(r=>r.sobreLucro).map(r=>sum(idx.map(m=>r.dist[m]*x.share[m]))));const tx=-sum(taxL.filter(l=>l.empresa_id===x.e.id).map(l=>l.valor));return {e:x.e,b,im,i2,tx}}).filter(x=>x.b);
  const tiles=[
    ['Faturamento bruto',k(bruto),deltaChip(bruto,brutoAnt),'vs '+labelCurto(ant.a,ant.p)],
    ['Taxas de cartão',k(taxas),`<span class="chip mute">${pct(taxas/bruto)} do bruto</span>`,''],
    ['Impostos sobre faturamento',k(imp),`<span class="chip warn">${pct(imp/bruto)} efetivo</span>`,'pagos no mês seguinte'],
    ['IRPJ e CSLL',k(ir),`<span class="chip warn">${pct(ir/bruto)}</span>`,'provisão; pagos por trimestre'],
    ['Sobra do faturamento',k(liq),`<span class="chip ${liq/bruto>.7?'good':'info'}">${pct(liq/bruto)} do bruto</span>`,'depois de taxas e impostos']];
  const hi=new Set(idx);
  return aviso+`
  <div style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap">${podeEditarAlguma()?'<a class="btn ghost" href="#tributos">Impostos e maquininha</a><button class="btn" data-acao="novo-fat">Registrar faturamento</button>':''}</div>
  <section class="grid g-tiles">${tiles.map(t=>`<div class="tile"><div class="lbl">${t[0]}</div><div class="val">${t[1]}</div><div class="cmp">${t[2]}<span>${t[3]}</span></div></div>`).join('')}</section>
  <div class="panel"><h2>Para onde vai cada real faturado · ${S.ano}</h2><p class="hint">Faturamento bruto por mês dividido em taxas da maquininha, impostos sobre o faturamento, IRPJ/CSLL e o que sobra. Barras fortes: ${labelPer()}.</p>
    ${chartStack({labels:MESES,hi,series:[{nome:'Sobra',cor:'var(--accent)',vals:liqAno},{nome:'Impostos sobre faturamento',cor:'var(--warn)',vals:impM},{nome:'IRPJ e CSLL',cor:'var(--bad)',vals:irM},{nome:'Taxas de cartão',cor:'var(--ink-3)',vals:taxAno}]})}
    <div class="legend"><span><i style="background:var(--accent)"></i>Sobra</span><span><i style="background:var(--warn)"></i>Impostos sobre faturamento</span><span><i style="background:var(--bad)"></i>IRPJ e CSLL</span><span><i style="background:var(--ink-3)"></i>Taxas de cartão</span></div></div>
  <section class="grid g-2e">
    <div class="panel"><h2>Por forma de recebimento</h2><p class="hint">${labelPer()} · taxa efetiva conforme os acordos com a maquininha</p>
      <div class="tbl-wrap"><table><thead><tr><th>Forma</th><th class="n">Vendas</th><th class="n">Bruto</th><th class="n">% do total</th><th class="n">Taxa</th><th class="n">Taxa %</th></tr></thead><tbody>
      ${formas.map(([f,o])=>`<tr><td>${esc(FORMAS[f]||'Não informado')}</td><td class="n">${o.n}</td><td class="n">${num.format(Math.round(o.v))}</td><td class="n">${pct(o.v/bruto)}</td><td class="n">${o.t?num.format(Math.round(o.t)):'–'}</td><td class="n">${o.t?pct(o.t/o.v):'–'}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td class="n">${fatL.length}</td><td class="n">${num.format(Math.round(bruto))}</td><td class="n">100,0%</td><td class="n">${num.format(Math.round(taxas))}</td><td class="n">${pct(taxas/bruto)}</td></tr></tbody></table></div></div>
    <div class="panel"><h2>Por empresa</h2><p class="hint">${labelPer()} · impostos pelo regime de cada CNPJ${S.sel.size<unidades().length?', rateados pelos prédios marcados':''}</p>
      <div class="tbl-wrap"><table><thead><tr><th>Empresa</th><th class="n">Bruto</th><th class="n">Impostos</th><th class="n">Efetivo</th><th class="n">IRPJ/CSLL</th><th class="n">Taxas</th></tr></thead><tbody>
      ${porEmp.map(x=>`<tr><td>${esc(nomeEmp(x.e))}<span class="unit">${esc(REGIMES[x.e.regime_tributario]||'regime não definido')}</span></td><td class="n">${num.format(Math.round(x.b))}</td><td class="n">${num.format(Math.round(x.im))}</td><td class="n">${pct(x.im/x.b)}</td><td class="n">${num.format(Math.round(x.i2)||0)}</td><td class="n">${num.format(Math.round(x.tx)||0)}</td></tr>`).join('')}</tbody></table></div></div>
  </section>
  ${await painelCaixaImpostos(D)}
  ${painelAgenda(D)}
  ${painelReforma(D)}`;
}

async function painelCaixaImpostos(D){
  const [pagas,abertas]=await Promise.all([parcelasPagas(S.ano),parcelasAbertas()]);
  const rec=Array(12).fill(0),imp=Array(12).fill(0),impPrev=Array(12).fill(0);const A=String(S.ano);
  const ehRecVenda=p=>{const c=conta(p.lancamentos?.conta_id);return c?.grupo_dre==='receita_bruta'};
  pagas.filter(p=>parcNaSel(p)&&ehRecVenda(p)).forEach(p=>rec[+p.data_pagamento.slice(5,7)-1]+= +(p.valor_pago??p.valor));
  abertas.filter(p=>parcNaSel(p)&&ehRecVenda(p)&&p.vencimento.startsWith(A)).forEach(p=>rec[+p.vencimento.slice(5,7)-1]+= +p.valor);
  Object.values(D.emp).forEach(x=>{const share=sum(x.fatSel)/(sum(x.fat)||1);
    [...x.rows,...x.rowsAnt].forEach(r=>{if(!r.venc.startsWith(A))return;const v=(r.ap?+r.ap.valor:r.valor)*share;(r.ap?imp:impPrev)[+r.venc.slice(5,7)-1]+=v})});
  const linha=(n,v,cls='')=>`<tr class="${cls}"><td>${n}</td>${v.map(x=>`<td class="n ${x<0?'neg':''}">${x?num.format(Math.round(x)):''}</td>`).join('')}<td class="n ${sum(v)<0?'neg':''}">${num.format(Math.round(sum(v)))}</td></tr>`;
  const saldo=rec.map((r,i)=>r-imp[i]-impPrev[i]);
  return `<div class="panel"><h2>Efeito no caixa · ${S.ano}</h2><p class="hint">Recebimentos das vendas pela data em que o dinheiro entra (cartão já líquido da taxa) e impostos pela data de vencimento: os do faturamento no mês seguinte à NF, IRPJ e CSLL no mês seguinte ao trimestre.</p>

// ---------- reforma tributária (LC 214/2025): transição 2026 a 2033
const REDUCOES={0:'Alíquota cheia',30:'Redução de 30% (profissões regulamentadas)',60:'Redução de 60% (saúde, educação e outros)',70:'Redução de 70% (locação de imóveis)'};
const TRANSICAO={2026:{pc:1,ii:1,cbs:0,ibs:0,txt:'Teste: CBS 0,9% e IBS 0,1% destacados na NF e compensados. Carga igual à de hoje.'},
  2027:{pc:0,ii:1,cbs:-.1,ibs:.1,txt:'PIS e COFINS acabam; entra a CBS cheia. ISS e ICMS continuam.'},
  2028:{pc:0,ii:1,cbs:-.1,ibs:.1,txt:'Igual a 2027.'},2029:{pc:0,ii:.9,ibs:'r10',txt:'ISS e ICMS caem para 90%; IBS em 10% da alíquota.'},
  2030:{pc:0,ii:.8,ibs:'r20',txt:'ISS e ICMS em 80%; IBS em 20%.'},2031:{pc:0,ii:.7,ibs:'r30',txt:'ISS e ICMS em 70%; IBS em 30%.'},
  2032:{pc:0,ii:.6,ibs:'r40',txt:'ISS e ICMS em 60%; IBS em 40%.'},2033:{pc:0,ii:0,ibs:'r100',txt:'ISS e ICMS acabam; IBS cheio.'}};
function painelReforma(D){
  const R=S.reforma=S.reforma||{cbs:8.8,ibs:17.7,red:0,compras:null};
  const anoFat=Object.values(D.emp).reduce((a,x)=>a+sum(x.fatSel),0);
  if(!anoFat)return '';
  const simples=Object.values(D.emp).filter(x=>x.e.regime_tributario==='simples_nacional');
  const outros=Object.values(D.emp).filter(x=>x.e.regime_tributario!=='simples_nacional');
  const fat=sum(outros.map(x=>sum(x.fatSel)));
  const soma=imps=>sum(outros.map(x=>{const sh=sum(x.fatSel)/(sum(x.fat)||1);return sum(x.rows.filter(r=>imps.includes(r.imposto)).map(r=>r.valor))*sh}));
  const pc=soma(['PIS','COFINS']),ii=soma(['ISS','ICMS']);
  const dAno=dre(D.ls.filter(l=>naSel(l.empresa_id,l.predio_id)&&outros.some(x=>x.e.id===l.empresa_id)));
  const comprasPadrao=dAno.rb?Math.round(-dAno.cu/dAno.rb*1000)/10:0;const comprasPct=R.compras??comprasPadrao;
  const anos=Object.keys(TRANSICAO).map(Number);
  const linhas=anos.map(a=>{const t=TRANSICAO[a];const cbs=a===2026?0:R.cbs+(t.cbs||0);const ibs=a===2026?0:typeof t.ibs==='string'?R.ibs*(+t.ibs.slice(1))/100:t.ibs;
    const tx=(cbs+ibs)/100;const debito=fat*tx*(1-R.red/100),credito=fat*comprasPct/100*tx;const novoIva=Math.max(0,debito-credito);
    const vCbs=tx?novoIva*cbs/(cbs+ibs):0,vIbs=novoIva-vCbs;const total=pc*t.pc+ii*t.ii+novoIva;return {a,t,pc:pc*t.pc,ii:ii*t.ii,cbs:vCbs,ibs:vIbs,total}});
  const hoje=pc+ii;const fim=linhas.at(-1);
  const inp=(id,v,label,extra='')=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" data-ref="${id}" inputmode="decimal" value="${String(v).replace('.',',')}" ${extra}></div>`;
  return `<div class="panel"><div class="ph"><div><h2>Reforma tributária: quanto muda para você</h2><p class="hint">Simulação sobre o faturamento de ${S.ano} (${k(fat)}${simples.length?', sem as empresas do Simples':''}) com as regras de transição da LC 214/2025. IRPJ e CSLL não mudam.</p></div></div>

      ${inp('cbs',R.cbs,'Alíquota de referência CBS (%)')}${inp('ibs',R.ibs,'Alíquota de referência IBS (%)')}
      <div class="field"><label for="red">Redução de alíquota da sua atividade</label><select id="red" data-ref="red">${Object.entries(REDUCOES).map(([v,n])=>`<option value="${v}" ${+v===R.red?'selected':''}>${n}</option>`).join('')}</select></div>
      ${inp('compras',comprasPct,'Compras que geram crédito (% do faturamento)')}</div>
    ${fat?`<section class="grid g-tiles" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:12px">
      <div class="tile"><div class="lbl">Hoje (PIS, COFINS, ISS, ICMS)</div><div class="val">${k(hoje)}</div><div class="cmp">${pct(hoje/fat)} do faturamento</div></div>
      <div class="tile"><div class="lbl">Em 2033, regra final</div><div class="val">${k(fim.total)}</div><div class="cmp">${pct(fim.total/fat)} do faturamento</div></div>
      <div class="tile"><div class="lbl">Diferença por ano</div><div class="val">${k(fim.total-hoje)}</div><div class="cmp"><span class="chip ${fim.total>hoje*1.005?'bad':fim.total<hoje*.995?'good':'mute'}">${fim.total>=hoje?'▲':'▼'} ${pct(Math.abs(fim.total-hoje)/(hoje||1))}</span>${fim.total>hoje?'paga mais':'paga menos'}</div></div></section>
    ${chartAnos({labels:anos.map(String),atual:anos.map(()=>hoje),novo:linhas.map(l=>l.total)})}
    <div class="legend"><span><i style="background:var(--plan)"></i>Regras de hoje</span><span><i style="background:var(--bad)"></i>Com a reforma, paga mais</span><span><i style="background:var(--good)"></i>Com a reforma, paga menos</span></div>
    <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Ano</th><th>O que acontece</th><th class="n">PIS/COFINS</th><th class="n">ISS/ICMS</th><th class="n">CBS</th><th class="n">IBS</th><th class="n">Total</th><th class="n">% do fat.</th><th class="n">vs hoje</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td class="mono">${l.a}</td><td class="wrap" style="min-width:260px"><span class="why" style="max-width:none">${l.t.txt}</span></td><td class="n">${num.format(Math.round(l.pc))}</td><td class="n">${num.format(Math.round(l.ii))}</td><td class="n">${num.format(Math.round(l.cbs))}</td><td class="n">${num.format(Math.round(l.ibs))}</td><td class="n"><b>${num.format(Math.round(l.total))}</b></td><td class="n">${pct(l.total/fat)}</td><td class="n">${deltaChip(l.total,hoje,true)}</td></tr>`).join('')}
    </tbody></table></div>`:''}
    <div class="effect" style="margin-top:12px"><b>Pontos de atenção</b><ul>
      <li><b>Créditos:</b> na CBS e no IBS tudo o que você compra com nota (mercadoria, serviços, aluguel, energia) gera crédito. Quanto mais compras com nota, menor o imposto final. Ajuste o campo “Compras que geram crédito”.</li>
      <li><b>Split payment:</b> a partir da implantação, a maquininha e os bancos poderão reter a CBS e o IBS no momento da liquidação. O imposto sai do caixa no dia do recebimento, não mais no mês seguinte.</li>

      <li>As alíquotas de referência são estimativas e serão fixadas por resolução do Senado. Valide a simulação com seu contador antes de decidir preço ou regime.</li></ul></div></div>`;
}

function acordosPara(emp,forma,parc,data){return S.acordos.filter(a=>a.empresa_id===emp&&a.ativo&&a.modalidade===forma&&parc>=a.parcelas_de&&parc<=a.parcelas_ate&&a.vigencia_inicio<=data&&(!a.vigencia_fim||a.vigencia_fim>=data))}
function calcFat(f){
  const emp=f.empresa.value,forma=f.forma.value,n=Math.max(1,+f.parcelas.value||1),data=f.emissao.value||HOJE;const bruto=parseValor(f.valor.value)||0;
  const ac=CARTAO.has(forma)?S.acordos.find(a=>a.id===f.acordo.value)||acordosPara(emp,forma,n,data)[0]:null;
  const taxa=ac?r2(bruto*ac.taxa_percentual/100+(+ac.taxa_fixa||0)):0;
  const liq=r2(bruto-taxa);let receb=[];
  if(ac){const q=forma==='credito_parcelado'&&!ac.antecipacao?n:1;const pb=r2(liq/q);for(let i=0;i<q;i++)receb.push({venc:addDias(data,ac.prazo_dias+30*i),valor:i<q-1?pb:r2(liq-pb*(q-1))})}
  else receb=[{venc:f.vencimento.value||data,valor:bruto}];
  return {emp,forma,n,data,bruto,ac,taxa,liq,receb};
}

    const q=f.dataset.id?sb.from('acordos_cartao').update(d).eq('id',f.dataset.id):sb.from('acordos_cartao').insert({...d,empresa_id:f.dataset.emp});const {error}=await q;if(error)throw error;fecharDrawer();toast('Acordo salvo.');await recarregarCad()},

    for(const r of rs)await lancarApuracao(r);await carregarApuracoes();invalidar();toast(`${rs.length} apurações lançadas em contas a pagar.`);render(true)},

<script>
// ===================== Orçamento travado, forecast, desvios e caixa orçado
const ORDEM_GRUPOS=['receita_bruta','deducoes','custos','despesas_operacionais','resultado_financeiro','outras','nao_operacional','ir_csll'];
const REGRAS={a_vista:'No próprio mês',dias_corridos:'Dias após a competência',dia_fixo_mes_seguinte:'Dia fixo do mês seguinte'};
async function lotes(tab,rows,sel){const out=[];for(let i=0;i<rows.length;i+=500){let q=sb.from(tab).insert(rows.slice(i,i+500));if(sel)q=q.select(sel);const {data,error}=await q;if(error)throw error;if(data)out.push(...data)}return out}
async function todasVersoes(forcar){if(forcar||!S.todasVer){const {data,error}=await sb.from('orcamento_versoes').select('*').order('ano',{ascending:false}).order('criado_em');if(error)throw error;S.todasVer=data;S.versoes={}}return S.todasVer}
async function versoesDe(emp,forcar){const t=await todasVersoes(forcar);S.versoes=S.versoes||{};if(!S.versoes[emp])S.versoes[emp]=t.filter(v=>v.empresa_id===emp).sort((a,b)=>b.ano-a.ano||String(a.criado_em).localeCompare(String(b.criado_em)));return S.versoes[emp]}
async function linhasDe(verId,forcar){S.linhasOrc=S.linhasOrc||{};if(forcar||!S.linhasOrc[verId])S.linhasOrc[verId]=todos(()=>sb.from('orcamento_linhas').select('id,empresa_id,conta_id,predio_id,centro_custo_id,competencia,valor').eq('versao_id',verId)).catch(e=>{delete S.linhasOrc[verId];throw e});return S.linhasOrc[verId]}
const premissaDe=(conta_id,data)=>S.premissas.filter(p=>p.conta_id===conta_id&&p.vigencia_inicio<=data&&(!p.vigencia_fim||p.vigencia_fim>=data)).sort((a,b)=>b.vigencia_inicio.localeCompare(a.vigencia_inicio))[0];
// transforma uma linha de competência em datas de caixa pela premissa da conta
function caixaDaLinha(contaId,comp,valor){
  const p=premissaDe(contaId,comp);const base=addDias(comp.slice(0,8)+'15',-(p?.antecedencia_compra_dias||0));
  if(!p||p.regra==='a_vista')return [{data:base,valor}];
  if(p.regra==='dia_fixo_mes_seguinte'){const d=new Date(base+'T12:00:00Z');return [{data:vencDia(d.getUTCFullYear(),d.getUTCMonth()+1,p.dia_fixo||10),valor}]}
  const pr=(p.prazos_dias&&p.prazos_dias.length?p.prazos_dias:[30]);const q=pr.length,parte=r2(valor/q);
  return pr.map((d,i)=>({data:addDias(base,d),valor:i<q-1?parte:r2(valor-parte*(q-1))}));
}
async function caixaDaVersao(v){
  if(v.congelada){S.caixaOrc=S.caixaOrc||{};if(!S.caixaOrc[v.id])S.caixaOrc[v.id]=await todos(()=>sb.from('orcamento_caixa').select('conta_id,data_caixa,valor').eq('versao_id',v.id));return S.caixaOrc[v.id].map(x=>({conta_id:x.conta_id,data:x.data_caixa,valor:+x.valor}))}
  const ls=await linhasDe(v.id);return ls.flatMap(l=>caixaDaLinha(l.conta_id,l.competencia,+l.valor).map(c=>({conta_id:l.conta_id,data:c.data,valor:c.valor,linha_id:l.id})));
}
const contasOrc=emp=>S.contas.filter(c=>c.empresa_id===emp&&c.analitica&&c.ativa).sort((a,b)=>{const ga=ORDEM_GRUPOS.indexOf(a.grupo_dre),gb=ORDEM_GRUPOS.indexOf(b.grupo_dre);return (ga<0?99:ga)-(gb<0?99:gb)||a.codigo.localeCompare(b.codigo,undefined,{numeric:true})});
const sinal=c=>c?.tipo==='receita'?1:-1;
const parseCel=v=>{const t=String(v??'').trim().replace(/[R$\s]/g,'');if(!t)return 0;if(t.includes(','))return parseFloat(t.replace(/\./g,'').replace(',','.'))||0;if(/^-?\d{1,3}(\.\d{3})+$/.test(t))return parseFloat(t.replace(/\./g,''))||0;return parseFloat(t)||0};
const fmtIn=v=>v?String(Math.round(Math.abs(v)*100)/100).replace('.',','):'';
function realizadoPorConta(ls,emp){const o={};ls.filter(l=>l.empresa_id===emp).forEach(l=>{const m=+l.competencia.slice(5,7)-1;(o[l.conta_id]=o[l.conta_id]||Array(12).fill(0))[m]+= +l.valor});return o}
function matriz(linhas,predio){const o={};linhas.filter(l=>predio===undefined||(l.predio_id||'')===predio).forEach(l=>{const m=+l.competencia.slice(5,7)-1;(o[l.conta_id]=o[l.conta_id]||Array(12).fill(0))[m]+= +l.valor});return o}

async function vOrcamento(){
  if(!S.empresas.length)return semEmpresa();
  if(!S.empresas.some(e=>e.id===S.orcEmp)){const tv=await todasVersoes();const cand=selEmp().length?selEmp():S.empresas;S.orcEmp=(cand.find(e=>tv.some(v=>v.empresa_id===e.id))||cand[0]).id}
  const emp=S.orcEmp,vs=await versoesDe(emp),ed=podeEditar(emp);
  if(!vs.some(v=>v.id===S.orcVer))S.orcVer=(vs.find(v=>v.ano===S.ano&&v.tipo==='orcamento'&&v.congelada)||vs.find(v=>v.ano===S.ano)||vs[0])?.id;
  const v=vs.find(x=>x.id===S.orcVer);S.orcTab=S.orcTab||'editar';
  const cab=`<div class="panel"><div class="ph"><div><h2>Orçamento e forecast</h2><p class="hint" style="margin:0">O orçamento travado vira o espelho oficial do ano. Os forecasts juntam o realizado até um mês com a nova previsão do restante, e mostram os desvios.</p></div>
    <div class="ctrls"><select id="orcEmp" aria-label="Empresa">${opcoesEmp(emp,false)}</select>${ed?'<button class="btn ghost" data-acao="nova-versao" data-tipo="forecast">Novo forecast</button><button class="btn" data-acao="nova-versao" data-tipo="orcamento">Novo orçamento</button>':''}</div></div>
    ${vs.length?`<div class="versions" style="flex-direction:row;flex-wrap:wrap">${vs.map(x=>`<button class="ver ${x.id===S.orcVer?'on':''}" data-ver="${x.id}" style="text-align:left;font:inherit;color:inherit;min-width:200px"><div><b>${esc(x.nome)}</b><small>${x.tipo==='forecast'?`Forecast · realizado até ${MESES[(x.mes_corte||1)-1]}`:'Orçamento'} · ${x.ano}</small></div>${x.congelada?'<span class="chip info">🔒 Travado</span>':'<span class="chip warn">Rascunho</span>'}</button>`).join('')}</div>`:''}</div>`;
  if(!v)return cab+vazio('Nenhum orçamento para esta empresa','<p style="margin:0">Crie o orçamento do ano. Você pode começar do realizado do ano anterior com um percentual de ajuste e depois editar mês a mês.</p>',ed?'<button class="btn" data-acao="nova-versao" data-tipo="orcamento">Novo orçamento</button>':'');
