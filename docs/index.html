      <div class="field"><label for="aSenha2">Repita a senha</label><input id="aSenha2" name="senha2" type="password" minlength="8" autocomplete="new-password" required></div>
      <button class="btn">Salvar senha e entrar</button></form>`,
    erro:`<h1>Não foi possível abrir o app</h1>${msg}<p>Verifique sua conexão e recarregue a página.</p>`,
  };
  a.innerHTML=`<div class="auth-card">${marca}${T[modo]}</div>`;
  a.querySelector('input:not([readonly])')?.focus();
}
async function entrar(user){
  S.user=user;
  const {data:perfil,error}=await sb.from('perfis').select('*').eq('usuario_id',user.id).maybeSingle();
  if(error){telaAuth('login',traduz(error));return}
  if(perfil&&!perfil.ativo){await sb.auth.signOut();telaAuth('login','Seu acesso foi desativado. Fale com o administrador.');return}
  S.perfil=perfil;S.master=!!perfil?.master;
  document.getElementById('auth').hidden=true;document.getElementById('app').hidden=false;
  document.getElementById('brandLogo').innerHTML=LOGO;document.getElementById('brandSub').textContent=S.master?APP_SUB+' · master':APP_SUB;
  document.getElementById('view').innerHTML='<div class="panel empty">Carregando…</div>';
  try{await carregarCadastros();await carregarAnos()}catch(err){document.getElementById('view').innerHTML=vazio('Não consegui carregar os cadastros',`<p style="margin:0">${esc(traduz(err))}</p>`,'<button class="btn" data-acao="recarregar-tudo">Tentar de novo</button>');return}
  if(!S.empresas.length&&S.master&&!location.hash)location.hash='empresas';
  render();
}
async function iniciar(){
  if(!sb){telaAuth('erro','A biblioteca de acesso ao banco não carregou.');return}
  if(window.DEMO){document.getElementById('filtros').insertAdjacentHTML('afterbegin','<span class="demo">Demonstração · dados fictícios</span>');const {data,error}=await sb.auth.signInWithPassword({email:MASTER_EMAIL,password:'demo'});if(!error)return entrar(data.user)}
  const {data:{session}}=await sb.auth.getSession();
  if(/access_token|error_description/.test(location.hash))history.replaceState(null,'',BASE_URL);
  if(LINK_ERRO){telaAuth('login',/expired|invalid/i.test(decodeURIComponent(LINK_ERRO))?'O link do e-mail expirou ou já foi usado. Peça um novo em “Esqueci minha senha”.':decodeURIComponent(LINK_ERRO.replace(/\+/g,' ')));return}
  if(session&&(LINK_TIPO==='invite'||LINK_TIPO==='recovery')){telaAuth('senha');return}
  if(session)entrar(session.user);else telaAuth('login',LINK_TIPO==='signup'?'✓ E-mail confirmado. Entre com sua senha.':'');
  sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY')telaAuth('senha');if(ev==='SIGNED_OUT'){S.user=null;telaAuth('login')}});
}

// ===================== formulários
const busy=(form,on)=>{const b=form.querySelector('button:not([type=button])');if(b){b.disabled=on;if(on){b.dataset.t=b.textContent;b.textContent='Aguarde…'}else if(b.dataset.t)b.textContent=b.dataset.t}};
async function recarregarCad(){await carregarCadastros();render()}
const FORMS={
  async login(f){const {data,error}=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.senha.value});if(error)return telaAuth('login',traduz(error));entrar(data.user)},
  async esqueci(f){const {error}=await sb.auth.resetPasswordForEmail(f.email.value.trim(),{redirectTo:BASE_URL});telaAuth(error?'esqueci':'login',error?traduz(error):'✓ Se o e-mail estiver cadastrado, você vai receber um link em instantes. Confira também o spam.')},
  async primeiro(f){
    if(f.senha.value!==f.senha2.value)return telaAuth('primeiro','As senhas não são iguais.');
    if(f.email.value.trim().toLowerCase()!==MASTER_EMAIL)return telaAuth('primeiro','Este caminho é só para a conta master. Outros usuários entram pelo convite.');
    const {data,error}=await sb.auth.signUp({email:f.email.value.trim(),password:f.senha.value,options:{emailRedirectTo:BASE_URL}});
    if(error)return telaAuth('primeiro',traduz(error));
    if(data.session)return entrar(data.user);
    telaAuth('login','✓ Conta criada. Enviamos um e-mail de confirmação para '+MASTER_EMAIL+'. Clique no link e depois entre com a senha.')},
  async definir(f){if(f.senha.value!==f.senha2.value)return telaAuth('senha','As senhas não são iguais.');
    const {data,error}=await sb.auth.updateUser({password:f.senha.value});if(error)return telaAuth('senha',traduz(error));toast('Senha salva.');entrar(data.user)},
  async 'senha-nova'(f){if(f.senha.value!==f.senha2.value)return toast('As senhas não são iguais.');const {error}=await sb.auth.updateUser({password:f.senha.value});if(error)return toast(traduz(error));fecharDrawer();toast('Senha alterada.')},
  async lanc(f){
    const emp=f.empresa.value,c=conta(f.conta.value);let v=parseValor(f.valor.value);
    if(!c)return toast('Escolha a conta do plano.');if(isNaN(v)||!v)return toast('Informe um valor válido.');
    v=r2(Math.abs(v)*(c.tipo==='receita'?1:-1));
    let parcId=null;const pn=f.parceiro.value.trim();
    if(pn){const p=S.parceiros.find(x=>x.empresa_id===emp&&norm(x.nome)===norm(pn));if(p)parcId=p.id;else{const {data,error}=await sb.from('parceiros').insert({empresa_id:emp,nome:pn,cliente:v>0,fornecedor:v<0}).select('id,empresa_id,documento,nome').single();if(error)throw error;S.parceiros.push(data);parcId=data.id}}
    const id=uuid();
    const {error}=await sb.from('lancamentos').insert({id,empresa_id:emp,predio_id:f.predio.value||null,conta_id:c.id,centro_custo_id:f.centro.value||null,parceiro_id:parcId,competencia:f.competencia.value,descricao:[f.documento.value.trim(),f.descricao.value.trim()].filter(Boolean).join(' · ')||null,valor:v});
    if(error)throw error;
    const pago=f.pagamento.value;
    const {error:e2}=await sb.from('parcelas').insert({empresa_id:emp,lancamento_id:id,numero:1,vencimento:f.vencimento.value||pago||f.competencia.value,valor:v,data_pagamento:pago||null,valor_pago:pago?v:null,forma_pagamento:f.forma.value.trim()||null,status:pago?'paga':'aberta',conta_bancaria_id:f.banco.value||null,centro_custo_id:f.centro.value||null});
    if(e2)throw e2;
    invalidar();await carregarAnos();fecharDrawer();toast('Lançamento salvo.');render()},
  async baixa(f){const ab=await S.parcAbertas;const p=ab.find(x=>x.id===f.dataset.id);let v=parseValor(f.valor.value);if(isNaN(v)||!v)return toast('Informe o valor pago.');
    const {error}=await sb.from('parcelas').update({status:'paga',data_pagamento:f.data.value,valor_pago:r2(Math.abs(v)*Math.sign(p.valor)),conta_bancaria_id:f.banco.value||null,forma_pagamento:f.forma.value.trim()||null}).eq('id',p.id);
    if(error)throw error;invalidar();fecharDrawer();toast('Baixa registrada.');render()},
  async conta(f){const id=f.dataset.id;const pai=f.pai.value||null;
    const dados={nome:f.nome.value.trim(),tipo:f.tipo.value,grupo_dre:f.grupo.value||null,analitica:f.analitica.value==='1',conta_pai:pai};
    if(id){dados.ativa=f.ativa.checked;const {error}=await sb.from('plano_contas').update(dados).eq('id',id);if(error)throw error}
    else{const {error}=await sb.from('plano_contas').insert({...dados,empresa_id:f.empresa.value,codigo:f.codigo.value.trim()});if(error)throw error}
    fecharDrawer();toast('Conta salva.');await recarregarCad()},
  async empresa(f){const cnpj=soDig(f.cnpj.value);if(cnpj.length!==14)return toast('O CNPJ precisa ter 14 dígitos.');
    const {error}=await sb.rpc('criar_empresa',{p_cnpj:cnpj,p_razao_social:f.razao.value.trim(),p_nome_fantasia:f.fantasia.value.trim()||null});if(error)throw error;
    S.sel=new Set();fecharDrawer();toast('Empresa criada com plano de contas padrão.');S.usuarios=null;await recarregarCad()},
  async predio(f){const {error}=await sb.from('predios').insert({empresa_id:f.dataset.emp,nome:f.nome.value.trim(),endereco:f.endereco.value.trim()||null});if(error)throw error;fecharDrawer();toast('Prédio cadastrado.');await recarregarCad()},
  async banco(f){const s=parseValor(f.saldo.value);const {error}=await sb.from('contas_bancarias').insert({empresa_id:f.dataset.emp,banco_nome:f.banco.value.trim(),banco_codigo:f.codigo.value.trim()||null,agencia:f.agencia.value.trim(),conta:f.conta.value.trim(),predio_id:f.predio.value||null,saldo_inicial:isNaN(s)?0:s,data_saldo_inicial:f.data.value||null});if(error)throw error;fecharDrawer();toast('Conta bancária cadastrada.');await recarregarCad()},
  async centro(f){const {error}=await sb.from('centros_custo').insert({empresa_id:f.dataset.emp,codigo:f.codigo.value.trim().toUpperCase(),nome:f.nome.value.trim(),responsavel:f.responsavel.value.trim()||null});if(error)throw error;fecharDrawer();toast('Centro de custo cadastrado.');await recarregarCad()},
  async usuario(f){
    const empresas=[...f.querySelectorAll('[data-ue]:checked')].map(x=>x.dataset.ue);
    const predios=[...f.querySelectorAll('[data-up]:checked')].filter(x=>empresas.includes(x.dataset.emp)).map(x=>x.dataset.up);
    const base={nome:f.nome.value.trim(),papel:f.papel.value,empresas,predios};
    if(f.dataset.uid){await chamarAdmin({acao:'atualizar',usuario_id:f.dataset.uid,ativo:f.ativo.checked,...base});toast('Acesso atualizado.')}
    else{if(!empresas.length)return toast('Marque pelo menos uma empresa.');await chamarAdmin({acao:'convidar',email:f.email.value.trim(),redirectTo:BASE_URL,...base});toast('Convite enviado para '+f.email.value.trim()+'.')}
    S.usuarios=null;fecharDrawer();render()},
};
Object.assign(FORMS,FORMS_FAT,FORMS_ORC);
// ===================== eventos
document.addEventListener('submit',async ev=>{const f=ev.target;const fn=FORMS[f.dataset.form];if(!fn)return;ev.preventDefault();busy(f,true);
  try{await fn(f)}catch(err){console.error(err);toast(traduz(err))}finally{if(document.body.contains(f))busy(f,false)}});
document.getElementById('fEmp').onclick=ev=>{ev.stopPropagation();document.getElementById('pop')?fecharPop():renderPop()};
document.getElementById('fAno').onchange=ev=>{S.ano=+ev.target.value;render()};
document.getElementById('fPer').onchange=ev=>{S.per.v=+ev.target.value;render()};
document.addEventListener('paste',ev=>{if(ev.target.dataset?.cel)colarGrade(ev)});
document.addEventListener('input',ev=>{if(ev.target.dataset?.cel){marcaCel(ev.target);return}if(ev.target.form?.dataset.form==='fat'){previewFat(ev.target.form);return}if(ev.target.id==='lancBusca'){S.lancBusca=ev.target.value;clearTimeout(S._bt);S._bt=setTimeout(async()=>{const pos=ev.target.selectionStart;await render(true);const i=document.getElementById('lancBusca');if(i){i.focus();i.setSelectionRange(pos,pos)}},300)}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='arqImp'&&t.files[0])lerPlanilha(t.files[0]);
  else if(t.id==='planoEmp'){S.planoEmp=t.value;render()}
  else if(t.id==='tribEmp'){S.tribEmp=t.value;render()}
  else if(t.dataset.cel)return;
  else if(t.id==='orcEmp'){if(S.orcEdit?.sujo&&!S._descarta){toast('Há valores não salvos. Salve antes de trocar.');t.value=S.orcEmp;return}S.orcEmp=t.value;S.orcVer=null;S.orcEdit=null;render()}
  else if(t.id==='orcPredio'){if(S.orcEdit?.sujo){toast('Salve antes de trocar de prédio.');t.value=S.orcPredio??'*';return}S.orcPredio=t.value;S.orcEdit=null;render(true)}
  else if(t.id==='premEmp'){S.premEmp=t.value;render()}
  else if(t.id==='acOrc'){S.acOrc=t.value;render(true)}
  else if(t.id==='acFc'){S.acFc=t.value||'-';render(true)}
  else if(t.id==='acAte'){S.acAte=+t.value;render(true)}
  else if(t.id==='cxMes'){S.cxMes=+t.value;render(true)}
  else if(t.dataset.ref){const v=t.dataset.ref==='red'?+t.value:parseValor(t.value);if(!isNaN(v)){S.reforma[t.dataset.ref]=v;render(true)}}
  else if(t.form?.dataset.form==='fat'){if(t.hasAttribute('data-troca-emp'))trocaEmpForm(t);previewFat(t.form)}
  else if(t.hasAttribute('data-troca-emp'))trocaEmpForm(t);
  else if(t.dataset.ue&&!t.checked)t.form.querySelectorAll(`[data-emp="${t.dataset.ue}"]`).forEach(x=>x.checked=false);
  else if(t.dataset.up&&t.checked){const e=t.form.querySelector(`[data-ue="${t.dataset.emp}"]`);if(e)e.checked=true}
  else if(t.dataset.fe){const keys=unidades().filter(u=>u.emp.id===t.dataset.fe).map(u=>u.key);if(setSel(keys,t.checked))render();renderPop()}
  else if(t.dataset.fu){if(setSel([t.dataset.fu],t.checked))render();renderPop()}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){fecharDrawer();fecharPop()}});
document.addEventListener('click',async ev=>{
  if(document.getElementById('pop')&&!ev.target.closest('#pop')&&!ev.target.closest('#fEmp'))fecharPop();
  if(ev.target.dataset?.fundo){fecharDrawer();return}
  const au=ev.target.closest('[data-auth]');if(au){telaAuth(au.dataset.auth);return}
  const per=ev.target.closest('[data-per]');if(per){const t=per.dataset.per,hm=+HOJE.slice(5,7)-1,base=S.per.tipo==='mes'?S.per.v:S.per.tipo==='tri'?3*S.per.v:(S.ano===+HOJE.slice(0,4)?hm:11);
    S.per={tipo:t,v:t==='tri'?Math.floor(base/3):t==='mes'?base:0};render();return}
  const dr=ev.target.closest('[data-dre]');if(dr){S.dreModo=dr.dataset.dre;render(true);return}
  const ab=ev.target.closest('[data-abre]');if(ab){const k_=ab.dataset.abre;S.abertos.has(k_)?S.abertos.delete(k_):S.abertos.add(k_);render(true);return}
  const cp=ev.target.closest('[data-cp]');if(cp){S.cpLado=cp.dataset.cp;render(true);return}
  const vb=ev.target.closest('[data-ver]');if(vb){if(S.orcEdit?.sujo){toast('Há valores não salvos. Salve antes de trocar de versão.');return}S.orcVer=vb.dataset.ver;S.orcEdit=null;S.acOrc=S.acFc=null;render(true);return}
  const ot=ev.target.closest('[data-orctab]');if(ot){S.orcTab=ot.dataset.orctab;render(true);return}
  const lr=ev.target.closest('[data-lanc]');if(lr){abrirLanc(lr.dataset.lanc);return}
  const cr=ev.target.closest('[data-conta]');if(cr){formConta(cr.dataset.conta);return}
  const b=ev.target.closest('[data-acao]');if(!b)return;const a=b.dataset.acao;
  try{
  if(a==='fechar')fecharDrawer();
  else if(a==='sel-todas'){S.sel=new Set(unidades().map(u=>u.key));render();renderPop()}
  else if(a==='pop-fechar')fecharPop();
  else if(a==='recarregar')render();
  else if(a==='recarregar-tudo')entrar(S.user);
  else if(a==='sair'){await sb.auth.signOut();location.hash=''}
  else if(a==='alterar-senha')drawer(`<h3>Alterar senha</h3><form data-form="senha-nova" class="form-grid"><div class="field wide"><label for="nS1">Nova senha (mínimo 8 caracteres)</label><input id="nS1" name="senha" type="password" minlength="8" autocomplete="new-password" required></div><div class="field wide"><label for="nS2">Repita a senha</label><input id="nS2" name="senha2" type="password" minlength="8" autocomplete="new-password" required></div><div class="wide" style="display:flex;gap:8px"><button class="btn">Salvar</button><button type="button" class="btn ghost" data-acao="fechar">Cancelar</button></div></form>`);
  else if(a==='novo-lanc')formLanc();
  else if(a==='baixar')formBaixa(b.dataset.id);
  else if(a==='excluir-lanc'){if(!confirm('Excluir este lançamento e suas parcelas?'))return;const {error}=await sb.from('lancamentos').delete().eq('id',b.dataset.id);if(error)throw error;invalidar();fecharDrawer();toast('Lançamento excluído.');render()}
  else if(a==='nova-conta')formConta();
  else if(formsCad[a])drawer(formsCad[a](b.dataset.emp));
  else if(a==='importar'){b.disabled=true;await executarImport()}
  else if(a==='desfazer-imp')await desfazerImport(b.dataset.id);
  else if(a==='convidar')formUsuario();
  else if(a==='editar-usuario')formUsuario(b.dataset.uid);
  else if(ACOES_FAT[a])await ACOES_FAT[a](b);
  else if(ACOES_ORC[a])await ACOES_ORC[a](b);
  else if(a==='reenviar'){b.disabled=true;await chamarAdmin({acao:'reenviar',email:b.dataset.email,redirectTo:BASE_URL});toast('E-mail de acesso reenviado para '+b.dataset.email+'.');b.disabled=false}
  }catch(err){console.error(err);toast(traduz(err));b.disabled=false}
});
addEventListener('hashchange',()=>{if(S.user){fecharDrawer();render()}});
iniciar();
